MEMORY
    {
    RAM:
        start  = $0000,
        size   = $B000,
        define = yes;
    
    VRAM:
        start  = $B000,
        size   = $0FA0,
        define = yes;
    
    IO:
        start  = $BFA0,
        size   = $0060,
        define = yes;
    
    ROM:
        start  = $C000,
        size   = $4000,
        file   = "bios.rom";
    }

SEGMENTS
    {
    CODE:
        load = ROM,
        type = ro;
    
    RODATA:
        load = ROM,
        type = ro;
    
    VECTORS:
        load  = ROM,
        type  = ro,
        start = $FFFA;
    }
