#===============================================================================
# File Name : memory.conf
# Project   : v65C02 8-bit Computer
# Author    : Ryan Clarke
# E-mail    : kj6msg@icloud.com
#===============================================================================
# Purpose : Linker configuration file for the v65C02 8-bit Computer BIOS
#===============================================================================

MEMORY
    {
    RAM:
        start  = $0000,
        size   = $C000,
        define = yes;
    
    VRAM:
        start  = $C000,
        size   = $2000,
        define = yes;
    
    IO:
        start  = $E000,
        size   = $1000,
        define = yes;
    
    ROM:
        start  = $F000,
        size   = $1000,
        file   = "bios.rom";
    }

SEGMENTS
    {
    CODE:
        load = ROM,
        type = ro;
    
    RODATA:
        load = ROM,
        type = ro;
    
    VECTORS:
        load  = ROM,
        type  = ro,
        start = $FFFA;
    }
