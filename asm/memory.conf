MEMORY
    {
    RAM:
        start   = $0200,
        size    = $AE00;
    
    ROM:
        start   = $C000,
        size    = $4000,
        file    = "bios.rom";
    }

SEGMENTS
    {
    CODE:
        load = ROM,
        type = ro;
    
    RODATA:
        load = ROM,
        type = ro;
    
    VECTORS:
        load  = ROM,
        type  = ro,
        start = $FFFA;
    }
