MEMORY
    {
    ROM:
        start   = $C000,
        size    = $4000,
        fillval = $EA,
        file    = "bios.rom";
    }

SEGMENTS
    {
    CODE:
        load = ROM,
        type = ro;
    
    RODATA:
        load = ROM,
        type = ro;
    
    VECTORS:
        load  = ROM,
        type  = ro,
        start = $FFFA;
    }
