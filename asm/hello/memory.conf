#===============================================================================
# File Name : memory.conf
# Project   : v65C02 8-bit Computer
# Author    : Ryan Clarke
# E-mail    : kj6msg@icloud.com
#===============================================================================
# Purpose : Linker configuration file for the v65C02 8-bit Computer user program
#===============================================================================


MEMORY
    {
    RAM:
        start   = $0300,
        size    = $AD00;
    }

SEGMENTS
    {
    CODE:
        load = RAM,
        type = rw;
    
    RODATA:
        load = RAM,
        type = ro;
    }
